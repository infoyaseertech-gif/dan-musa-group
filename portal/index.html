body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);-webkit-font-smoothing:antialiased}

:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:9px;font-weight:700;font-size:14px;border:1.5px solid transparent;cursor:pointer;background:none;color:inherit;line-height:1.2;transition:.15s;white-space:nowrap}
.gold{background:var(--gold);color:#2E3165}.gold:hover{background:#DDA23A}
.nv{background:var(--navy);color:#fff}.nv:hover{background:var(--navy2)}
.ln{border-color:var(--line);background:var(--sf)}.ln:hover{border-color:var(--gold)}
.dg{color:var(--er);border-color:var(--line);background:var(--sf)}.sm{padding:6px 12px;font-size:13px}
.bd{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-wn{background:var(--wnb);color:var(--wn)}.b-er{background:var(--erb);color:var(--er)}.b-n{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
label{display:grid;gap:6px;font-weight:600;font-size:13px;margin-bottom:14px}
input,select,textarea{font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(200,146,43,.4);border-color:var(--gold)}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--navy)}
textarea{min-height:80px;resize:vertical}.er{color:var(--er);font-size:13px;min-height:18px;margin-bottom:10px}
/* login */
.lw{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.lv{background:var(--navy);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lv::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 90% 0,rgba(200,146,43,.25),transparent 60%),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px) 0 0/44px 44px}
.lv>*{position:relative}.lv h1{font-size:clamp(30px,3.6vw,44px);max-width:14ch}.lv p{color:#B9C8DC;margin-top:14px;max-width:42ch;font-size:16px}
.lv ul{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:10px;color:#DCE6F2}.lv li::before{content:"✓ ";color:var(--gold);font-weight:800}
.lf{display:grid;place-items:center;padding:32px}.lc{width:100%;max-width:400px}.lc h2{font-size:28px}.lc>p{color:var(--mute);margin:6px 0 24px}
.demo{margin-top:24px;padding:16px;border:1px dashed var(--line);border-radius:12px;background:var(--sf);font-size:13px;color:var(--mute)}.demo b{color:var(--ink)}.demo .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
/* shell */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sb{background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;z-index:150}
.br{display:flex;gap:11px;align-items:center;padding:4px 10px 18px}
.mk{width:46px;height:21px;background:#fff;-webkit-mask:var(--sym) center/contain no-repeat;mask:var(--sym) center/contain no-repeat;flex:none}.flogo{background:#fff;-webkit-mask:var(--flogo) center/contain no-repeat;mask:var(--flogo) center/contain no-repeat}.mob{display:none}
.br b{display:block;line-height:1.1}.br small{color:#9FB0C7;font-size:12px}
.gl{color:#7F94B0;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:16px 12px 6px}
.nv2{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:9px;background:none;border:0;color:#B9C8DC;font-weight:600;font-size:14px;cursor:pointer;text-align:left;margin-bottom:2px}
.nv2:hover{background:rgba(255,255,255,.08);color:#fff}.nv2.on{background:rgba(200,146,43,.18);color:#fff}.nv2.on svg{stroke:var(--gold)}
.nv2 svg{width:19px;height:19px;stroke:currentColor;flex:none}.nv2 .n{margin-left:auto;background:var(--gold);color:var(--navy);border-radius:999px;font-size:11px;padding:1px 8px;font-weight:800}
.ub{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}.ub small{color:#9FB0C7;display:block}.ub .r{display:flex;gap:8px;margin-top:10px}.ub button{flex:1;color:#fff;border-color:rgba(255,255,255,.25);background:none}
.mn{min-width:0}
.tb{background:var(--sf);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:100}
.tb h1{font-size:19px}.tb .sp{flex:1}.bg{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;color:var(--ink);cursor:pointer}
.ct{padding:28px;max-width:1280px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}.ph p{color:var(--mute);margin-top:4px}.ph h2{font-size:24px}
.svh{display:flex;gap:14px;align-items:center}.ico{width:50px;height:50px;border-radius:12px;background:var(--navy);display:grid;place-items:center;flex:none}.ico svg{width:26px;height:26px;stroke:var(--gold)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{padding:12px 16px;background:none;border:0;border-bottom:3px solid transparent;font-weight:700;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap;margin-bottom:-1px}.tab:hover{color:var(--ink)}.tab.on{color:var(--ink);border-color:var(--gold)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--sh)}.card h3{font-size:16px;margin-bottom:14px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.2fr 1fr}.mb18{margin-bottom:18px}
.st{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-align:left;color:inherit;width:100%}
button.st{cursor:pointer}button.st:hover{border-color:var(--gold)}
.st small{color:var(--mute);font-weight:600;display:block}.st b{font-size:24px;letter-spacing:-.02em;display:block;margin-top:2px}
.kp{cursor:pointer;text-align:left;color:inherit;width:100%;transition:.15s}.kp:hover{border-color:var(--gold)}
.kp .t{display:flex;gap:12px;align-items:center;margin-bottom:14px}.kp .t .ico{width:40px;height:40px}.kp .t .ico svg{width:21px;height:21px}
.kp small{color:var(--mute);font-weight:600}.kp .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px}.kp .ft{display:flex;justify-content:space-between;align-items:flex-end;color:var(--mute);font-size:12px}
.sp7{width:120px;height:38px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--sf)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;padding:11px 14px;background:var(--bg);color:var(--mute);font-size:12px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}td.r,th.r{text-align:right}tfoot td{font-weight:800;background:var(--bg)}
.fl{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.fl input{max-width:320px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--sf);font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;justify-content:space-between;align-items:center}.li:last-child{border:0}.li small{color:var(--mute);display:block}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.kc{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}.kc>h3{font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between}
.tk{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}.tk b{display:block;margin-bottom:4px}.tk small{color:var(--mute);display:block;margin-bottom:10px}.tk .a{display:flex;gap:6px;flex-wrap:wrap}
.an{margin-bottom:14px}.an h3{margin-bottom:4px}.an small{color:var(--mute)}.an p{margin-top:10px;white-space:pre-wrap}
.empty{padding:36px;text-align:center;color:var(--mute)}.note{color:var(--mute);font-size:13px;margin-top:12px}
.mdl{position:fixed;inset:0;background:rgba(4,12,24,.7);display:none;place-items:center;z-index:300;padding:20px}.mdl.on{display:grid}
.mb{background:var(--sf);border-radius:16px;padding:28px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto}.mb.w{max-width:820px}.mb>h3{font-size:20px;margin-bottom:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.lr{display:grid;grid-template-columns:2.4fr .7fr 1.1fr 34px;gap:8px;margin-bottom:8px;align-items:center}.lr .x{background:none;border:0;color:var(--er);font-size:20px;cursor:pointer}
.tot{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);margin:10px 0;font-weight:800;font-size:18px}
.ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;z-index:400;opacity:0;pointer-events:none;transition:.25s}.ts.on{opacity:1}
.bk{display:none}
.ac{display:flex;gap:6px;flex-wrap:wrap}
/* printable documents */
.pd{background:#fff;color:#111;padding:36px;border:1px solid #ddd;border-radius:6px;font:14px/1.5 "Segoe UI",system-ui,sans-serif}
.pd .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #D4A03C;padding-bottom:16px;margin-bottom:20px}
.pd h1{font-size:26px;color:#2E3165;margin:0;letter-spacing:0}.pd .co b{font-size:17px;color:#2E3165}.pd .co,.pd .mt{font-size:12.5px;color:#444}

.out{border-color:rgba(255,255,255,.4);color:#fff}.out:hover{background:rgba(255,255,255,.12)}
input,select,textarea{border-radius:12px;border-width:1.5px}
.sb{background:linear-gradient(180deg,#15173D 0%,#1F2255 55%,#2E3165 100%);padding:22px 16px}
.br{padding:6px 10px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:6px}
.gl{color:#8E93C4}
.nv2{border-radius:12px;padding:11px 14px;position:relative;transition:.2s}.nv2.on{background:rgba(255,255,255,.1)}
.nv2.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.ub{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px}
.tb{background:var(--sf);background:color-mix(in srgb,var(--sf) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:16px 32px}
.tb h1{font-size:22px}.ct{padding:32px}
.ph h2{font-size:30px}
.card{border-radius:20px;padding:24px}.card h3{font-size:17px}
.st{border-radius:18px;padding:20px 22px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.st::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.st b{font:700 28px var(--hf);letter-spacing:-.02em;margin-top:4px}
button.st{transition:.2s}button.st:hover{transform:translateY(-3px)}
.kp{transition:.25s}.kp:hover{transform:translateY(-4px);box-shadow:var(--sh)}.kp .v{font-family:var(--hf)}
.hb{background:linear-gradient(135deg,#15173D,#2E3165 70%,#3B418F);color:#fff;border-radius:24px;padding:30px 34px;margin-bottom:22px;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:var(--sh)}
.hb::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 90% 0,rgba(212,160,60,.28),transparent 65%),radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.4px) 0 0/26px 26px}
.hb::after{content:"";position:absolute;right:-20px;bottom:-30px;width:300px;aspect-ratio:2.2/1;background:#fff;opacity:.07;-webkit-mask:var(--sym) center/contain no-repeat;mask:var(--sym) center/contain no-repeat}
.hb>*{position:relative;z-index:1}.hb h2{font-size:32px;color:#fff}.hb p{color:#C9CCEA;margin-top:6px}.hb .dt{color:#F0C46A;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.tw{border-radius:18px;box-shadow:var(--sh)}
th{background:var(--tint);padding:13px 16px;text-transform:uppercase;letter-spacing:.06em;font-size:11px}td{padding:13px 16px}
table tr:hover td{background:rgba(212,160,60,.07)}
.tabs{display:flex;width:fit-content;max-width:100%;gap:6px;background:var(--tint);padding:6px;border-radius:999px;border:0;margin-bottom:24px}
.tab{border:0;border-radius:999px;padding:9px 18px;margin:0}.tab.on{background:var(--sf);color:var(--ink);box-shadow:0 6px 14px -8px rgba(20,22,58,.5)}
.chip.on{background:var(--navy2);border-color:var(--navy2)}.fl input{border-radius:999px}
.ico{background:linear-gradient(135deg,var(--navy2),#4349A0);box-shadow:0 12px 22px -14px rgba(46,49,101,.9)}.ico svg{stroke:#F0C46A}
.kc{border-radius:18px}.tk{border-radius:14px;box-shadow:0 8px 18px -14px rgba(20,22,58,.5)}
.mdl{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);background:rgba(10,11,40,.6)}.mb{border-radius:24px}
.lv{background:linear-gradient(145deg,#15173D,#2E3165)}.lv h1{font-size:clamp(32px,3.6vw,48px)}.lc h2{font-size:32px}
.lv::after{content:"";position:absolute;right:-6%;bottom:-6%;width:70%;aspect-ratio:2.2/1;background:#fff;opacity:.06;-webkit-mask:var(--sym) center/contain no-repeat;mask:var(--sym) center/contain no-repeat}
.ts{border-radius:999px;padding:12px 24px}
.bg svg{width:22px;height:22px;stroke:currentColor}
td.ac{display:table-cell;white-space:nowrap}td.ac .btn{margin:2px 6px 2px 0}td:first-child{white-space:nowrap}
@media (max-width:980px){.shell{grid-template-columns:1fr}.sb{position:fixed;left:0;top:0;width:270px;transform:translateX(-105%);transition:.25s;height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}.sb.on{transform:none}.bg{display:grid;place-items:center}.bk.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:140}.tb{padding:12px 16px}.ct{padding:18px 16px}.g3,.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.kb{grid-template-columns:1fr}.lw{grid-template-columns:1fr}.lv{display:none}.pd{padding:20px}.pd .hd{flex-direction:column}.pd .ti{text-align:left}}
@media (max-width:600px){.g3,.g4,.two,.three{grid-template-columns:1fr}.lr{grid-template-columns:1fr 1fr 34px}.lr>:first-child{grid-column:1/-1}.lr .p{grid-column:1/3}}
@media (max-width:980px){.mob{display:block}}
/* ===== phone layer ===== */
.bnav{display:none}
@media (max-width:980px){
 .ct{padding-bottom:104px}
 input,select,textarea{font-size:16px}.btn.sm{min-height:40px}.nv2{min-height:46px}.chip{min-height:42px}
 .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:120;background:var(--sf);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -14px 30px -22px rgba(20,22,58,.55)}
 .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;background:none;color:var(--mute);font:700 11px var(--f);cursor:pointer;border-radius:12px}
 .bnav button svg{width:22px;height:22px;stroke:currentColor}.bnav button.on{color:var(--navy2);background:var(--tint)}
 :root[data-theme="dark"] .bnav button.on{color:#fff}
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bnav button.on{color:#fff}}
 .ts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .ph{align-items:flex-start}.ph h2{font-size:26px}.hb{padding:24px 22px;border-radius:20px}.hb h2{font-size:26px}
 .tabs{width:auto;max-width:none;margin:0 -16px 20px;padding:6px 16px;border-radius:0;overflow-x:auto;scrollbar-width:none;background:none}.tabs::-webkit-scrollbar{display:none}
 .tab{white-space:nowrap;background:var(--tint)}.tab.on{background:var(--navy2);color:#fff}
 .mdl{place-items:end center;padding:0}
 .mb,.mb.w{max-width:none;width:100%;max-height:92vh;border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s ease both}
 @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
 .g4{grid-template-columns:1fr 1fr!important}.st{padding:16px 16px 16px 18px}.st b{font-size:21px}.st small{font-size:12px}
 .kb{gap:12px}.acts .btn{flex:1 1 auto}
}
@media (max-width:820px){
 .tw{border:0;box-shadow:none;background:none;overflow:visible;border-radius:0}
 .tw table,.tw tbody,.tw tfoot,.tw tr,.tw td{display:block;width:100%}
 .tw tr:has(>th){display:none}
 .tw tr{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:10px 16px;margin-bottom:12px;box-shadow:var(--sh)}
 .tw tr:hover td{background:none}
 .tw td{display:flex!important;justify-content:space-between;align-items:center;gap:16px;padding:8px 0;border:0;text-align:right;white-space:normal!important;width:100%}
 .tw td::before{content:attr(data-label);color:var(--mute);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:left;flex:none}
 .tw td[data-label=""]::before{display:none}
 .tw td:first-child{font-size:15px;padding-top:4px;border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:10px}
 .tw td.ac{flex-wrap:wrap;justify-content:flex-start;padding-top:12px;margin-top:4px;border-top:1px solid var(--line)}.tw td.ac::before{display:none}
 .tw tfoot tr{background:var(--tint)}
 .tw td select{width:auto}
 .fl input{max-width:none;width:100%}
 .two,.three{grid-template-columns:1fr}
}
@media print{body::before,#app,#bk,#ts{display:none!important}.mdl{position:static;display:block;background:none;padding:0}.mb,.mb.w{box-shadow:none;max-width:none;max-height:none;padding:0}.no-print{display:none!important}.pd{border:0;padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 if(A=="adduser")modal("Add staff",`<form data-f="user"><label>Full name<input name="name"></label><div class="two"><label>Username<input name="user" autocapitalize="none"></label><label>Password (6+ characters)<input name="pw"></label></div><label>Role<select name="role"><option value="staff">Staff</option><option value="mgr">Manager</option></select></label><label>Services this person may open</label><div class="two" style="margin-bottom:14px">${D.map(d=>`<label style="flex-direction:row;display:flex;gap:10px;align-items:center;margin:0;font-weight:500"><input type="checkbox" name="acc" value="${d.k}"> ${d.n}</label>`).join("")}</div>${btns(`<button class="btn gold">Add staff</button>`)}</form>`);
 if(A=="tog"){const u=U(id);u.on=u.on?0:1;logit((u.on?"Restored access for ":"Closed access for ")+u.name);render();toast(u.on?"Access restored":"Access closed")}
 if(A=="csv")dl("dan-musa-report-"+iso(0)+".csv",csv(repRows()));
 if(A=="csvstk"){const rs=[["Product","Opening","Received","Sold","Adjusted","Remaining","Sales value","Stock value (cost)"]],from=S.p==0?"0000":wk(S.p);DB.prods.forEach(p=>{const m=DB.moves.filter(x=>x.pid==p.id&&x.date>=from),rc=m.filter(x=>x.type=="in").reduce((q,x)=>q+x.qty,0),so=m.filter(x=>x.type=="sale").reduce((q,x)=>q+x.qty,0);const ad=m.filter(x=>x.type=="return").reduce((q,x)=>q+x.qty,0)-m.filter(x=>x.type=="loss").reduce((q,x)=>q+x.qty,0);rs.push([p.name,p.qty-rc+so-ad,rc,so,ad,p.qty,m.filter(x=>x.type=="sale").reduce((q,x)=>q+x.qty*x.price,0),p.qty*p.cost])});dl("stock-report-"+iso(0)+".csv",csv(rs))}
 if(A=="backup")dl("dan-musa-backup-"+iso(0)+".json",JSON.stringify(DB,null,1));
});
document.addEventListener("input",e=>{const t=e.target;
 if(t.hasAttribute("data-flt")){const q=t.value.toLowerCase(),tb=t.closest(".fl").nextElementSibling;(tb.matches(".tw")?tb:tb.querySelector(".tw")||tb).querySelectorAll("tr").forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(q)?"":"none"})}
 const f=t.closest("form");if(f&&f.querySelector(".lns")){if(t.name=="pid"){}calc(f)}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.name=="cu"){const c=CU().find(x=>x.name.toLowerCase()==t.value.trim().toLowerCase()),f=t.closest("form");if(c&&f){if(f.elements.ph&&!f.elements.ph.value)f.elements.ph.value=c.phone;if(f.elements.ad&&!f.elements.ad.value)f.elements.ad.value=c.addr}}
 if(t.name=="pid"&&t.closest(".lr")){const o=t.selectedOptions[0];t.closest(".lr").querySelector("[name=p]").value=o.dataset.pr;calc(t.closest("form"))}
 if(t.name=="vat")calc(t.closest("form"));
 if(t.dataset.acc){const[u,k]=t.dataset.acc.split("|"),x=U(u);x.acc=t.checked?[...new Set([...x.acc,k])]:x.acc.filter(y=>y!=k);logit((t.checked?"Gave ":"Removed ")+x.name+(t.checked?" access to ":" access from ")+dv(k).n);toast(t.checked?"Access granted":"Access removed")}});
document.addEventListener("submit",async e=>{ops++;try{await submitH(e)}catch(x){toast(friendly(x))}finally{ops--;if(!ops&&me)save()}});
async function submitH(e){e.preventDefault();const f=e.target,er=f.querySelector(".er")||$("#le"),g=n=>f.elements[n]&&f.elements[n].value.trim(),k=S.k,fail=m=>{er.textContent=m};
 if(f.id=="lg"){if(!SB)return fail("The portal is not connected yet. See config.js.");const un=g("u").toLowerCase(),email=un.includes("@")?un:un+"@"+(CFG.emailDomain||"staff.danmusa.ng");fail("Signing in...");const{error}=await SB.auth.signInWithPassword({email,password:f.p.value});if(error)return fail("Username or password is not correct.");await enter();if(me)logit("Signed in");return}
 const q=f.dataset.f,rows=()=>[...f.querySelectorAll(".lr")];
 if(q=="sale"){const ln=rows().map(r=>({pid:r.querySelector("[name=pid]").value,qty:+r.querySelector("[name=q]").value,price:+r.querySelector("[name=p]").value})),use={};for(const l of ln){if(!l.qty||l.qty<1||!(l.price>=0))return fail("Check quantity and price on every line.");use[l.pid]=(use[l.pid]||0)+l.qty;const p=DB.prods.find(x=>x.id==l.pid);if(use[l.pid]>p.qty)return fail(`Only ${p.qty} of ${p.name} left in stock.`)}
  ensureCust(g("cu"));const s=await makeSale({date:iso(0),customer:g("cu"),method:g("me"),lines:ln,by:me.id});logit("Sale "+s.no+" for "+mny(s.total));close();render();toast("Sale completed. Receipt "+s.no);viewDoc("rct",DB.rcpts.find(r=>r.sale==s.id).id);return}
 if(q=="cust"){if(!g("name"))return fail("Enter the customer name.");if(CU().some(c=>c.name.toLowerCase()==g("name").toLowerCase()))return fail("This customer is already saved.");CU().push({id:uid(),name:g("name"),phone:g("phone"),addr:g("addr"),by:me.id});logit("Added customer "+g("name"));close();render();toast("Customer saved")}
 if(q=="adj"){const p=DB.prods.find(x=>x.id==f.dataset.id),n=+g("q"),ty=g("ty");if(!(n>0))return fail("Enter the quantity.");if(ty=="loss"&&n>p.qty)return fail("Only "+p.qty+" in stock.");p.qty+=ty=="loss"?-n:n;DB.moves.push({id:uid(),date:iso(0),pid:p.id,type:ty,qty:n,ref:g("rs")||"No reason given",by:me.id});logit((ty=="loss"?"Removed ":"Returned ")+n+" x "+p.name);close();render();toast("Stock adjusted")}
 if(q=="rpw"){const u=U(f.dataset.id),pw=g("n");if(pw.length<6)return fail("Use at least 6 characters.");const r=await SB.functions.invoke("staff-admin",{body:{action:"reset",user_id:u.id,password:pw}});const em=r.data&&r.data.error;if(r.error||em)return fail(em||"Could not reset the password.");logit("Reset password for "+u.name);close();toast("Password reset")}
 if(q=="stockin"){const p=DB.prods.find(x=>x.id==g("pid")),n=+g("q"),c=+g("c");if(!(n>0))return fail("Enter the quantity received.");p.qty+=n;if(c>0)p.cost=c;DB.moves.push({id:uid(),date:g("d")||iso(0),pid:p.id,type:"in",qty:n,cost:c||p.cost,ref:g("sp")||"Supplier not stated",by:me.id});logit(`Received ${n} x ${p.name}`);close();render();toast("Stock updated")}
 if(q=="prod"){if(!g("name")||!(+g("price")>=0)||g("price")==="")return fail("Enter a product name and selling price.");const id=f.dataset.id;if(id){const p=DB.prods.find(x=>x.id==id);Object.assign(p,{name:g("name"),cat:g("cat"),brand:g("brand"),cost:+g("cost")||0,price:+g("price"),min:+g("min")||0});logit("Edited product "+p.name)}else{const p={id:uid(),sku:"TEL-"+String(DB.prods.length+1).padStart(3,"0"),name:g("name"),cat:g("cat"),brand:g("brand")||"Generic",cost:+g("cost")||0,price:+g("price"),min:+g("min")||0,qty:+g("qty")||0};DB.prods.push(p);if(p.qty)DB.moves.push({id:uid(),date:iso(0),pid:p.id,type:"in",qty:p.qty,cost:p.cost,ref:"Opening stock",by:me.id});logit("Added product "+p.name)}close();render();toast("Product saved")}
 if(q=="rec"){const d=dv(k),o={};for(const x of d.f){o[x[0]]=g(x[0]);if(o[x[0]]==="")return fail("Fill in every field.");if(x[2]=="n"||x[2]=="m")o[x[0]]=+o[x[0]]}DB.recs.push({id:uid(),div:k,date:g("date")||iso(0),by:me.id,d:o,st:appr(k)?"Approved":"Pending"});logit("Added a "+d.n+" record");close();render();toast(appr(k)?"Record saved":"Record saved and sent for approval")}
 if(q=="inv"){const it=rows().map(r=>({d:r.querySelector("[name=d]").value.trim(),q:+r.querySelector("[name=q]").value,p:+r.querySelector("[name=p]").value})).filter(i=>i.d);if(!g("cu"))return fail("Enter the customer name.");if(!it.length||it.some(i=>!(i.q>0)||!(i.p>=0)))return fail("Add at least one item with quantity and price.");ensureCust(g("cu"),g("ph"),g("ad"));const i=await makeInvoice({div:k,date:g("date"),due:g("due"),customer:g("cu"),phone:g("ph"),addr:g("ad"),items:it,vat:f.elements.vat.checked,notes:g("notes"),by:me.id});logit("Created invoice "+i.no);close();render();toast("Invoice "+i.no+" created");viewDoc("inv",i.id);return}
 if(q=="pay"){const i=DB.invs.find(x=>x.id==f.dataset.id),a=+g("a");if(!(a>0)||a>i.total-i.paid)return fail("Enter an amount up to the balance.");const r=await addPay(i.id,a,g("me"),g("d")||iso(0),me.id);logit(`Received ${mny(a)} for ${i.no}`);close();render();toast("Receipt "+r.no+" issued");viewDoc("rct",r.id);return}
 if(q=="rct"){if(!g("cu")||!(+g("a")>0)||!g("ds"))return fail("Enter who paid, the amount and what it is for.");ensureCust(g("cu"));const r=await makeReceipt({div:k,date:g("d"),customer:g("cu"),desc:g("ds"),amt:+g("a"),method:g("me"),by:me.id});logit("Issued receipt "+r.no);close();render();toast("Receipt issued");viewDoc("rct",r.id);return}
 if(q=="task"){if(!g("title"))return fail("Describe the task.");const to=g("to");DB.tasks.unshift({id:uid(),title:g("title"),to,div:U(to).acc[0]||"",due:g("due"),st:"To do",by:me.id});logit("Assigned a task to "+U(to).name);close();render();toast("Task created")}
 if(q=="ann"){if(!g("title")||!g("body"))return fail("Enter a title and a message.");DB.ann.unshift({id:uid(),title:g("title"),body:g("body"),scope:g("scope"),by:me.id,at:Date.now()});logit("Posted an announcement");close();render();toast("Announcement posted")}
 if(q=="doc"){if(!g("name"))return fail("Enter the document name.");const id=uid(),fl=f.elements.file&&f.elements.file.files[0];let path="";if(fl){if(fl.size>10485760)return fail("The file is larger than 10 MB.");path=g("div")+"/"+id+"-"+fl.name.replace(/[^\w.\-]/g,"_");const up=await SB.storage.from("documents").upload(path,fl);if(up.error)return fail("Upload failed: "+up.error.message)}DB.docs.unshift({id,name:g("name"),type:g("type"),div:g("div"),exp:g("exp"),file:path,by:me.id});logit("Added document "+g("name"));close();render();toast("Document saved")}
 if(q=="user"){if(!g("name")||!g("user")||g("pw").length<6)return fail("Enter a name, a username and a password of at least 6 characters.");if(DB.users.some(u=>u.user==g("user").toLowerCase()))return fail("That username is taken.");const r=await SB.functions.invoke("staff-admin",{body:{action:"create",name:g("name"),username:g("user").toLowerCase(),password:g("pw"),role:g("role"),services:[...f.querySelectorAll("[name=acc]:checked")].map(x=>x.value)}});const em=r.data&&r.data.error;if(r.error||em)return fail(em||"Could not add the staff member.");logit("Added staff member "+g("name"));close();await reload(true);toast("Staff member added")}
 if(q=="acct"){if(g("n").length<6)return fail("Use at least 6 characters.");const v=await SB.auth.signInWithPassword({email:me.email,password:f.elements.o.value});if(v.error)return fail("Current password is not correct.");const w=await SB.auth.updateUser({password:g("n")});if(w.error)return fail(w.error.message);logit("Changed password");close();toast("Password changed")}
 if(q=="set"){const c=co();["name","trade","rc","phone","email","addr","bank","foot"].forEach(x=>c[x]=g(x));c.vat=+g("vat")||0;const se=await SB.from("settings").update({name:c.name,trade:c.trade,rc:c.rc,phone:c.phone,email:c.email,addr:c.addr,bank:c.bank,vat:c.vat,foot:c.foot}).eq("id",1);if(se.error)throw se.error;logit("Updated company settings");toast("Settings saved")}
 save()}

boot();
